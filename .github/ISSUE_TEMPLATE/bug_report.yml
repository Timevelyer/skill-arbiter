name: 缺陷报告
description: 报告规则、模板或 CI 的实际缺陷（不要粘贴真实内部技能文本）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        本仓库是文档型技能包。请提供**最小可复现输入**（可脱敏，但保留结构）。
        安全类问题请改用 Security 页面的 private report，不要开公开 Issue。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 规则判定（reference/arbiter-rules.md）
        - 模板（templates/）
        - 用例或 Rubric（tests/）
        - CI 校验（.github/workflows/validate.yml）
        - 安装说明（install/）
        - 其他
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 引用具体章节、规则 ID 或模板字段。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 贴出实际产物片段或 CI 日志的关键行。
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: 最小复现输入
      description: 两份技能文本的冲突部分，或触发该判定的最小片段。
      render: text
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: 宿主与版本
      description: 如 Claude Code / Codex / OpenCode / ZCode / DeepSeek Harness / WorkBuddy，以及版本号。
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认内容不含凭据、客户数据或未脱敏的内部技能文本。
          required: true
        - label: 我没有为了让 CI 通过而修改评分、探针状态或 golden 基线。
          required: true
