  reviewer: "Timevelyer"
  reviewed_at: "2026-11-23"
  evidence: "diff -u tests/golden/basic-merge.md tests/fixtures/basic-merge.md returns no differences (CI job C). Sign-off recorded on owner instruction; see signoff_basis."
case_runs:
